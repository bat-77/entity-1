<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTITY-1</title>
<link rel="icon" type="image/png" id="faviconLink" href="favicon-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

<header class="topbar">
  <div class="topbar-left">
    <div class="brand">ENTITY-1</div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="looking">Looking For</button>
      <button class="tab-btn" data-tab="selling">Selling</button>
    </nav>
  </div>

  <div class="topbar-center">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchBox" placeholder="Search registry...">
    </div>
  </div>

  <div class="topbar-right">
    <select id="currencySelect"></select>
    <button id="themeToggle" class="icon-btn" title="Toggle theme">
      <svg id="themeIconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="themeIconMoon" class="hidden" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
    <div id="authArea"></div>
  </div>
</header>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <h2>Admin Login</h2>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="off">
    <input type="password" id="loginPass" placeholder="Password" autocomplete="off">
    <input type="password" id="loginToken" placeholder="GitHub Token (only needed to save changes)" autocomplete="off">
    <div style="font-size:10px;color:var(--muted);margin:-6px 0 10px;line-height:1.4;">
      Leave blank if you already saved a token in this browser, or if you only want to view. See README for how to generate one.
    </div>
    <div class="modal-actions">
      <button id="loginSubmit" class="btn primary">Log In</button>
      <button id="loginCancel" class="btn">Cancel</button>
    </div>
    <div id="loginError" class="error-text"></div>
  </div>
</div>

<!-- ENTRY EDIT MODAL -->
<div id="entryModal" class="modal hidden">
  <div class="modal-box wide">
    <h2 id="entryModalTitle">New Entry</h2>
    <form id="entryForm">
      <input type="hidden" id="entryId">
      <input type="hidden" id="entryType">

      <div class="form-grid">
        <label>Make <input type="text" id="f_make" required></label>
        <label>Model <input type="text" id="f_model" required></label>
        <label>Year <input type="text" id="f_year"></label>
        <label>Mileage (km) <input type="text" id="f_mileage"></label>
        <label>VIN <input type="text" id="f_vin"></label>
        <label>Location <input type="text" id="f_location"></label>
        <label>Priority
          <select id="f_priority">
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
            <option>Urgent</option>
          </select>
        </label>
        <label>Process / Status <input type="text" id="f_process" placeholder="e.g. Sourcing, Negotiating, Closed"></label>
        <label>Leads <input type="text" id="f_leads" placeholder="e.g. First Autos, Alex"></label>
        <label>Budget / Price <input type="number" id="f_amount" step="any"></label>
        <label>Currency
          <select id="f_currency"></select>
        </label>
      </div>

      <label class="full">Tags <input type="text" id="f_tags" placeholder="comma separated, e.g. Sourcing, Supercar, Off-Market"></label>

      <label class="full">Notes / Spec
        <textarea id="f_notes" rows="3" placeholder="GCC/EU specs, interior colour, off-market only, etc."></textarea>
      </label>

      <label class="full">Image
        <input type="file" id="f_image" accept="image/*">
        <img id="f_imagePreview" class="img-preview hidden">
      </label>

      <div class="modal-actions">
        <button type="submit" class="btn primary" id="entrySaveBtn">Save Entry</button>
        <button type="button" id="entryCancel" class="btn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- ENTRY DETAIL / LOG MODAL -->
<div id="detailModal" class="modal hidden">
  <div class="modal-box wide">
    <div id="detailContent"></div>
  </div>
</div>

<main id="app">
  <div class="feed-toolbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="feed-status"><span class="dot"></span><span id="entryCount">0</span> LISTED</div>
      <div class="feed-status" id="syncStatus" style="border:1px solid var(--border);padding:5px 10px;letter-spacing:1px;">LOCAL ONLY</div>
    </div>
    <div class="toolbar-actions">
      <div class="view-toggle">
        <button class="view-btn active" id="viewCardsBtn" title="Card view">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="view-btn" id="viewBoxesBtn" title="Box view">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
      </div>
      <button id="addEntryBtn" class="btn primary admin-only hidden">+ New Post</button>
    </div>
  </div>
  <div id="cardGrid" class="feed view-cards"></div>
</main>

<footer class="foot">ENTITY-1 &mdash; private brokerage registry</footer>

<script src="config.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
